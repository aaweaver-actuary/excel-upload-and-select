services:
  backend:
    build:
      context: ./backend
      target: production
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
  frontend:
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
  frontend-test:
    profiles: ["test"]
    build:
      context: .
      target: test
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
