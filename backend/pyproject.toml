[project]
name = "excel-import-backend"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "rapidfuzz>=3.14,<4",
  "uvicorn>=0.30,<1",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.22,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100"

[tool.coverage.run]
omit = ["app/__init__.py"]
